services:
  chroma:
    image: chromadb/chroma:1.5.9
    container_name: rag-starter-kit-chroma-1
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    container_name: rag-starter-kit-ollama-1
    ports:
      - "11435:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: rag-starter-kit-app-1
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - PUBLIC_POSTHOG_KEY=${PUBLIC_POSTHOG_KEY:-}
      - PUBLIC_POSTHOG_HOST=${PUBLIC_POSTHOG_HOST:-}
      - CHROMA_URL=http://chroma:8000
      - OLLAMA_BASE_URL=http://ollama:11434
    ports:
      - "3000:3000"
    depends_on:
      chroma:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped
volumes:
  chroma-data:
  ollama-data:
